<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PDFSafe{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="logo" aria-hidden="true">PS</span>
      <span>PDFSafe</span>
    </a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/docs">API</a>
      <a href="/metrics">Metrics</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>PDFSafe v{{ app_version }}</span>
    <span>Static analysis + AI triage</span>
  </footer>
</body>
</html>
