name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libqpdf-dev
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # PDFSafe is a Windows application. Type-checking it as Linux reports
      # winreg and ctypes.WinDLL as missing attributes - true on this runner,
      # irrelevant to the product, and it fails the build for six errors that
      # cannot occur where the code actually runs.
      - run: mypy --platform win32 src

  # The shipped product. Runs on Windows because that is what users install,
  # and because the parser sandbox uses spawn semantics that differ from fork.
  test-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[desktop]" pytest pytest-asyncio pytest-cov pytest-qt
      - name: Run the test suite
        env:
          PDFSAFE_ENV: test
          PDFSAFE_AI_ENABLED: "false"
        run: pytest -q

      # Keeps the removed server stack from creeping back in and silently
      # inflating the installer by tens of megabytes.
      - name: Check the import graph
        run: python tools/check_import_graph.py

  # Cross-platform check of the shared engine.
  test-engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libqpdf-dev
      - run: pip install -e ".[dev]"
      - name: Run the full suite
        env:
          PDFSAFE_ENV: test
          PDFSAFE_AI_ENABLED: "false"
          QT_QPA_PLATFORM: offscreen
        # -p no:pytestqt, not just -m "not gui": the plugin imports QtGui during
        # pytest_configure, before marker selection happens, so a deselected GUI
        # suite still fails on libEGL. Disabling the plugin is also the more
        # honest test - this job exists to prove the engine runs without Qt.
        # The plugin name is "pytest-qt", the entry-point name, not the module
        # name "pytestqt" - and -p no:<name> matching nothing is silent, so the
        # wrong spelling looks exactly like a fix that did not work.
        run: pytest --cov=pdfsafe --cov-report=xml -m "not gui" -p no:pytest-qt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit --strict || true

  # Confirms the installer pipeline still works; artifacts are unsigned here.
  build-check:
    runs-on: windows-latest
    needs: [lint, test-desktop]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[desktop,build]"
      - shell: pwsh
        run: .\packaging\build.ps1 -SkipInstaller
      - shell: pwsh
        run: |
          $exe = "dist\PDFSafe\PDFSafe.exe"
          if (-not (Test-Path $exe)) { throw "Executable was not produced" }
          $mb = [math]::Round((Get-ChildItem "dist\PDFSafe" -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "Bundle size: $mb MB"
          if ($mb -gt 250) { throw "Bundle is $mb MB - check the PyInstaller exclusions" }
