[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfsafe"
version = "0.2.0"
description = "PDFSafe - desktop PDF malware scanner with static analysis and optional AI triage."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Awais Abdullah", email = "awaisabdullahm@gmail.com" }]
keywords = ["pdf", "malware", "security", "static-analysis", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# ---------------------------------------------------------------------------
# Core: everything the analysis engine needs. Deliberately small - this is what
# ends up inside the shipped .exe.
# ---------------------------------------------------------------------------
dependencies = [
    # configuration / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # persistence
    "sqlalchemy>=2.0.36",
    # pdf analysis
    "pikepdf>=9.4.0",
    "pypdf>=5.1.0",
    "yara-python>=4.5.1",
    # ai
    "anthropic>=0.40.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    # secrets: Windows Credential Manager / macOS Keychain / Secret Service
    "keyring>=25.5.0",
    # observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    # cli
    "typer>=0.13.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
# Optional OCR for image-only documents. Deliberately not part of the default
# install or the shipped bundle: it adds a rendering engine and OCR models that
# most users never invoke, and rasterising attacker-controlled input is the one
# thing PDFSafe otherwise never does. See src/pdfsafe/analysis/ocr.py.
#
# pypdfium2 rather than poppler/pdf2image because it is a self-contained wheel
# with no system package to locate at runtime in a frozen build.
# Rendering only. Pick an engine below - installing this alone gives you the
# page rasteriser and a clear "no OCR engine installed" message.
ocr = ["pypdfium2>=4.30.0"]

# Recommended. Tesseract is a single Apache-2.0 binary with a long audit
# history, and the whole install is 15-50 MB. It is an external executable, so
# it must be installed separately:
#   winget install UB-Mannheim.TesseractOCR
#   choco install tesseract
#   apt install tesseract-ocr  /  brew install tesseract
ocr-tesseract = ["pypdfium2>=4.30.0", "pytesseract>=0.3.13"]

# Pure-pip fallback for environments where an external binary is not practical.
# Measured against Tesseract on the same 833-document sample it was 9.3x slower
# (567.8s against 61.1s) for identical detection, on top of pulling roughly
# 90 MB - opencv-python alone is 44 MB - with opaque model weights rather than
# an auditable program. Convenient, and worse on every axis that was measured.
ocr-rapidocr = [
    "pypdfium2>=4.30.0",
    "rapidocr-onnxruntime>=1.3.24",
    "numpy>=1.26.0",
]

# The shipped desktop application.
desktop = [
    "PySide6-Essentials>=6.8.0",
    "watchdog>=6.0.0",
    "pywin32>=308; sys_platform == 'win32'",
]

build = [
    "pyinstaller>=6.11.0",
    "pillow>=11.0.0",
]

dev = [
    "pdfsafe[desktop,build]",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
pdfsafe = "pdfsafe.cli:app"

[project.gui-scripts]
# Windowed entry point - no console window when launched from the shell.
pdfsafe-desktop = "pdfsafe.desktop.app:main"

[project.urls]
Homepage = "https://github.com/Awadul/PDFSafe"
Repository = "https://github.com/Awadul/PDFSafe"
Issues = "https://github.com/Awadul/PDFSafe/issues"
Changelog = "https://github.com/Awadul/PDFSafe/blob/main/CHANGELOG.md"
Security = "https://github.com/Awadul/PDFSafe/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
# The YARA rules under analysis/rules are picked up automatically as package
# data; do not add a force-include for them or hatchling reports a conflict.
packages = ["src/pdfsafe"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"packaging/**" = ["E501"]

# Qt's API is camelCase. N802 covers overridden methods (rowCount, dropEvent),
# N815 covers signal attributes (scanCompleted). Renaming either would break the
# binding to Qt - these are not our naming choices to make.
"src/pdfsafe/desktop/**" = ["N802", "N815"]

# The parser walks attacker-controlled structure. Every exception is swallowed
# on purpose so a malformed document degrades to a partial result rather than
# failing the scan - a file that breaks the parser is itself a signal, recorded
# in parse_errors. Logging each one individually would flood the log on a
# deliberately hostile document with thousands of broken objects.
# SIM118: the .keys() calls are on pikepdf Dictionary objects, not dicts.
"src/pdfsafe/analysis/structure.py" = ["S110", "S112", "SIM105", "SIM118"]

[tool.ruff.lint.isort]
known-first-party = ["pdfsafe"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "build/", "dist/", "packaging/"]

[[tool.mypy.overrides]]
module = [
    "yara", "pikepdf.*", "keyring.*", "watchdog.*",
    "win32api", "win32con", "winreg",
    # The OCR extra is optional, so these are absent in a default checkout and
    # in CI. Without this, `mypy src` fails for everyone who has not installed
    # pdfsafe[ocr] - the intended majority. They are only referenced inside
    # functions that already handle ImportError.
    "pypdfium2.*", "rapidocr_onnxruntime.*", "pytesseract.*",
    # numpy arrives only as a RapidOCR dependency; ocr.py imports it inside the
    # RapidOCR branch, which never runs without that extra installed.
    "numpy",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gui: requires a Qt display",
    "llm: hits a real LLM provider",
]

[tool.coverage.run]
branch = true
source = ["src/pdfsafe"]
omit = ["*/desktop/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
